<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Kisaan Drishti</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
<main class="auth-wrap">
  <section class="auth-side">
    <img src="images/logo.svg" alt="Kisaan Drishti logo" class="auth-logo">
    <h1>Kisaan Drishti</h1>
    <p>A Vision for Every Farmer, A Better Tomorrow for Agriculture.</p>
  </section>

  <section class="auth-card">
    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="active">Log In</button>
      <button type="button" id="tabReg">New Farmer</button>
    </div>

    <form id="loginForm" novalidate>
      <h2>Welcome back 🌾</h2>
      <div class="field"><label for="lId">Mobile number or Email</label><input id="lId" autocomplete="username" placeholder="e.g. 9876543210"></div>
      <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" placeholder="Your password"></div>
      <div class="auth-msg" id="lMsg" role="alert"></div>
      <button class="btn auth-btn" type="submit">Log In</button>
      <p class="auth-switch">New here? <a href="#" id="toReg">Create your farmer account</a></p>
    </form>

    <form id="regForm" novalidate hidden>
      <h2>Join Kisaan Drishti 🌱</h2>
      <div class="field"><label for="rName">Full name</label><input id="rName" autocomplete="name" placeholder="e.g. Ramesh Patil"></div>
      <div class="field"><label for="rId">Mobile number or Email</label><input id="rId" autocomplete="username" placeholder="e.g. 9876543210"></div>
      <div class="field"><label for="rVil">Village / Town</label><input id="rVil" placeholder="e.g. Rampur"></div>
      <div class="field"><label for="rPass">Password (min 6 characters)</label><input id="rPass" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="rPass2">Confirm password</label><input id="rPass2" type="password" autocomplete="new-password"></div>
      <div class="auth-msg" id="rMsg" role="alert"></div>
      <button class="btn auth-btn" type="submit">Create Account</button>
      <p class="auth-switch">Already registered? <a href="#" id="toLogin">Log in</a></p>
    </form>
    <p class="auth-note">Demo login: accounts are saved only in this browser.</p>
  </section>
</main>

<script src="auth.js"></script>
<script>
  if (KD.current()) location.replace("index.html");
  const $ = id => document.getElementById(id);
  function show(which) {
    const login = which === "login";
    $("loginForm").hidden = !login; $("regForm").hidden = login;
    $("tabLogin").classList.toggle("active", login); $("tabReg").classList.toggle("active", !login);
  }
  $("tabLogin").onclick = $("toLogin").onclick = e => { e.preventDefault(); show("login"); };
  $("tabReg").onclick = $("toReg").onclick = e => { e.preventDefault(); show("reg"); };

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const id = $("lId").value.trim(), pw = $("lPass").value;
    if (!id || !pw) { $("lMsg").textContent = "Enter your mobile/email and password."; return; }
    const r = await KD.login(id, pw);
    if (r.ok) location.href = "index.html"; else $("lMsg").textContent = r.msg;
  });
  $("regForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("rName").value.trim(), id = $("rId").value.trim(), village = $("rVil").value.trim();
    const pw = $("rPass").value, pw2 = $("rPass2").value, m = $("rMsg");
    if (!name || !id || !village) { m.textContent = "Please fill all fields."; return; }
    if (!/^\d{10}$/.test(id) && !/^\S+@\S+\.\S+$/.test(id)) { m.textContent = "Enter a 10-digit mobile number or a valid email."; return; }
    if (pw.length < 6) { m.textContent = "Password must be at least 6 characters."; return; }
    if (pw !== pw2) { m.textContent = "Passwords do not match."; return; }
    const r = await KD.register({ name, id, village, password: pw });
    if (r.ok) location.href = "index.html"; else m.textContent = r.msg;
  });
</script>
</body>
</html>
